[project]
name = "nebula-sdk"
version = "0.0.0+from-source"
description = "Official Python SDK for Nebula by Zeroset, the state and memory layer for AI agents."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Zeroset", email = "support@zeroset.com" }]
keywords = ["nebula", "zeroset", "memory", "ai", "agents", "knowledge-graph", "retrieval", "sdk", "openapi"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic[email]>=2.12",
]

[project.urls]
Homepage = "https://docs.zeroset.com/clients/python"
Documentation = "https://docs.zeroset.com"
Repository = "https://github.com/zeroset-inc/nebula-python"
Issues = "https://github.com/zeroset-inc/nebula-python/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nebula"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
